<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas - Servicio de Emergencias</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { chinalco: '#8b0000', chinalcoDark: '#660000' }
                }
            }
        }
    </script>
    <style>
        .hidden-view { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden font-sans">

    <!-- PANTALLA DE LOGIN / REGISTRO -->
    <div id="auth-screen" class="flex h-screen justify-center items-center bg-gray-200">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-4 border-chinalco">
            <div class="text-center mb-6">
                <i class="fa-solid fa-helmet-safety text-4xl text-chinalco mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">Servicio de Emergencias</h2>
                <p class="text-sm text-gray-500">Minera Chinalco Perú</p>
            </div>

            <!-- Formulario Login -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="login-email" class="mt-1 w-full p-2 border rounded focus:ring-chinalco focus:border-chinalco" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="login-password" class="mt-1 w-full p-2 border rounded focus:ring-chinalco focus:border-chinalco" required>
                        <button type="button" onclick="togglePassword('login-password', 'icon-login')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500">
                            <i id="icon-login" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-chinalco text-white p-2 rounded hover:bg-chinalcoDark transition font-bold">Ingresar</button>
                <p class="text-sm text-center mt-4">¿No tienes acceso? <a href="#" onclick="toggleAuthForms()" class="text-chinalco font-bold">Solicitar Cuenta</a></p>
            </form>

            <!-- Formulario Registro -->
            <form id="register-form" class="space-y-4 hidden-view">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                    <input type="text" id="reg-name" class="mt-1 w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="mt-1 w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="reg-password" class="mt-1 w-full p-2 border rounded" required minlength="6">
                        <button type="button" onclick="togglePassword('reg-password', 'icon-reg')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500">
                            <i id="icon-reg" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white p-2 rounded hover:bg-gray-900 transition font-bold">Enviar Solicitud</button>
                <p class="text-sm text-center mt-4"><a href="#" onclick="toggleAuthForms()" class="text-chinalco font-bold">Volver al Login</a></p>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen" class="hidden-view h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-chinalco text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-list-check text-xl"></i>
                <h1 class="text-lg font-bold hidden md:block">Seguimiento de Pendientes - Emergencias</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-sm bg-chinalcoDark px-3 py-1 rounded-full flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span id="online-count">1</span> en línea
                </div>
                <div class="text-sm text-right hidden md:block">
                    <div id="user-display-name" class="font-bold">Usuario</div>
                    <div id="user-role-badge" class="text-xs text-gray-300">Rol</div>
                </div>
                <button id="btn-logout" class="bg-white text-chinalco p-2 rounded-full hover:bg-gray-200 transition" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar / Navegación -->
            <aside class="w-64 bg-white border-r shadow-sm flex flex-col">
                <nav class="flex-1 p-4 space-y-2">
                    <button onclick="switchTab('tasks')" class="w-full flex items-center gap-3 p-3 rounded bg-red-50 text-chinalco font-bold hover:bg-red-100 transition" id="tab-tasks">
                        <i class="fa-solid fa-clipboard-list"></i> Tareas y Pendientes
                    </button>
                    <button onclick="switchTab('users')" class="w-full flex items-center gap-3 p-3 rounded text-gray-600 hover:bg-gray-100 transition hidden-view" id="tab-users">
                        <i class="fa-solid fa-users-gear"></i> Gestión de Usuarios
                    </button>
                </nav>
            </aside>

            <!-- Contenido Principal -->
            <main class="flex-1 bg-gray-50 flex flex-col relative">
                
                <!-- VISTA DE TAREAS -->
                <div id="view-tasks" class="flex-1 p-6 flex flex-col h-full overflow-y-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">Lista de Pendientes</h2>
                        <button onclick="exportToExcel('tasks')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-file-excel"></i> Exportar a Excel
                        </button>
                    </div>

                    <!-- Input Nueva Tarea -->
                    <form id="task-form" class="mb-6 flex gap-2 hidden-view">
                        <input type="text" id="new-task-text" placeholder="Añadir una nueva tarea..." class="flex-1 p-3 border rounded shadow-sm focus:ring-2 focus:ring-chinalco outline-none text-lg" required>
                        <select id="new-task-category" class="p-3 border rounded shadow-sm bg-white">
                            <option value="Operativa">Operativa</option>
                            <option value="Administrativa">Administrativa</option>
                            <option value="Logística">Logística</option>
                            <option value="Entrenamiento">Entrenamiento</option>
                        </select>
                        <button type="submit" class="bg-chinalco text-white px-6 py-3 rounded shadow hover:bg-chinalcoDark transition font-bold">
                            <i class="fa-solid fa-plus"></i> Añadir
                        </button>
                    </form>

                    <!-- Lista de Tareas -->
                    <div class="bg-white rounded-lg shadow-sm border p-4 flex-1 overflow-y-auto">
                        <ul id="task-list" class="space-y-2">
                            <!-- Tareas renderizadas por JS -->
                        </ul>
                    </div>
                </div>

                <!-- VISTA DE USUARIOS (Solo Admin) -->
                <div id="view-users" class="hidden-view flex-1 p-6 h-full overflow-y-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">Control de Accesos</h2>
                        <button onclick="exportToExcel('users')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-file-excel"></i> Exportar
                        </button>
                    </div>

                    <div class="bg-white rounded-lg shadow border overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-700 uppercase text-xs">
                                    <th class="p-4 border-b">Nombre / Correo</th>
                                    <th class="p-4 border-b">Fecha Solicitud</th>
                                    <th class="p-4 border-b">Estado / Rol</th>
                                    <th class="p-4 border-b">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="users-list" class="text-sm">
                                <!-- Usuarios renderizados por JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        /* =========================================
           1. CONFIGURACIÓN DE SERVICIOS
        ========================================= */
        // ¡IMPORTANTE! Reemplaza esto con tus datos de Firebase
        const firebaseConfig = {
  apiKey: "AIzaSyBjv44fEAHKH-W2onNB6pPW1nHZwTTnnb0",
  authDomain: "tareas-pendientes-emergencias.firebaseapp.com",
  projectId: "tareas-pendientes-emergencias",
  storageBucket: "tareas-pendientes-emergencias.firebasestorage.app",
  messagingSenderId: "96277630087",
  appId: "1:96277630087:web:928479563d98880fdcbc22",
  measurementId: "G-1KZN5N5RMB"
};
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        /* =========================================
           2. ESTADO GLOBAL
        ========================================= */
        let currentUserData = null;
        let tasksData = [];
        let usersData = [];
        let heartbeatInterval;

        /* =========================================
           3. LÓGICA DE INTERFAZ (UI)
        ========================================= */
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function toggleAuthForms() {
            document.getElementById('login-form').classList.toggle('hidden-view');
            document.getElementById('register-form').classList.toggle('hidden-view');
        }

        function switchTab(tab) {
            document.getElementById('view-tasks').classList.add('hidden-view');
            document.getElementById('view-users').classList.add('hidden-view');
            
            document.getElementById('tab-tasks').classList.remove('bg-red-50', 'text-chinalco');
            document.getElementById('tab-users').classList.remove('bg-red-50', 'text-chinalco');

            if(tab === 'tasks') {
                document.getElementById('view-tasks').classList.remove('hidden-view');
                document.getElementById('tab-tasks').classList.add('bg-red-50', 'text-chinalco');
            } else {
                document.getElementById('view-users').classList.remove('hidden-view');
                document.getElementById('tab-users').classList.add('bg-red-50', 'text-chinalco');
            }
        }

        function applyRolePermissions(role) {
            const taskForm = document.getElementById('task-form');
            const tabUsers = document.getElementById('tab-users');
            
            if (role === 'lector') {
                taskForm.classList.add('hidden-view');
                tabUsers.classList.add('hidden-view');
            } else if (role === 'editor') {
                taskForm.classList.remove('hidden-view');
                tabUsers.classList.add('hidden-view');
            } else if (role === 'admin') {
                taskForm.classList.remove('hidden-view');
                tabUsers.classList.remove('hidden-view');
            }
        }

        /* =========================================
           4. LÓGICA DE AUTENTICACIÓN
        ========================================= */
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = db.collection("usuarios").doc(user.uid);
                let doc = await userRef.get();

                // CORRECCIÓN: Autenticación automática como Admin para este correo específico
                if (user.email === "supervision.rescate@gmail.com") {
                    if (!doc.exists) {
                        // Si no existe el documento en Firestore, lo crea como admin
                        await userRef.set({
                            nombre: "Administrador Principal",
                            email: user.email,
                            rol: 'admin',
                            estado: 'aprobado',
                            fechaSolicitud: new Date().toLocaleString('es-PE'),
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else if (doc.data().rol !== 'admin' || doc.data().estado !== 'aprobado') {
                        // Si existe pero no es admin o no está aprobado, lo fuerza
                        await userRef.update({ rol: 'admin', estado: 'aprobado' });
                    }
                    // Volver a leer el documento actualizado
                    doc = await userRef.get();
                }

                // Verificación estándar para todos los usuarios
                if (doc.exists) {
                    currentUserData = { id: user.uid, ...doc.data() };
                    
                    if (currentUserData.estado !== 'aprobado') {
                        alert("Tu cuenta aún está pendiente de aprobación por el administrador.");
                        auth.signOut();
                        return;
                    }

                    document.getElementById('auth-screen').classList.add('hidden-view');
                    document.getElementById('app-screen').classList.remove('hidden-view');
                    
                    document.getElementById('user-display-name').innerText = currentUserData.nombre;
                    document.getElementById('user-role-badge').innerText = currentUserData.rol.toUpperCase();
                    
                    applyRolePermissions(currentUserData.rol);
                    loadTasks();
                    if(currentUserData.rol === 'admin') loadUsers();
                    startPresenceSystem();
                } else {
                    // Si llega aquí, es un correo nuevo que no se registró por el formulario
                    alert("Tu usuario no está registrado en la base de datos de este sistema. Solicita una cuenta primero.");
                    auth.signOut();
                }
            } else {
                document.getElementById('auth-screen').classList.remove('hidden-view');
                document.getElementById('app-screen').classList.add('hidden-view');
                stopPresenceSystem();
            }
        });

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (error) {
                console.error(error);
                alert("Error al ingresar: Verifique que su correo y contraseña sean correctos.");
            }
        });

        // SOLICITAR CUENTA (REGISTRO)
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;

            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                const fechaActual = new Date();
                
                await db.collection("usuarios").doc(userCred.user.uid).set({
                    nombre: name,
                    email: email,
                    rol: 'lector',
                    estado: 'pendiente',
                    fechaSolicitud: fechaActual.toLocaleString('es-PE'),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Solicitud enviada correctamente. Por favor, solicite la autorización para poder ingresar.");
                auth.signOut();
                toggleAuthForms();

            } catch (error) {
                if(error.code === 'auth/email-already-in-use') {
                    alert("Este correo ya está registrado en el sistema. Intente iniciar sesión.");
                } else {
                    alert("Error al solicitar cuenta: " + error.message);
                }
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

        /* =========================================
           5. GESTIÓN DE TAREAS
        ========================================= */
        function loadTasks() {
            db.collection("tareas").orderBy("creadoEn", "desc").onSnapshot(snapshot => {
                tasksData = [];
                const taskList = document.getElementById('task-list');
                taskList.innerHTML = '';

                snapshot.forEach(doc => {
                    const t = { id: doc.id, ...doc.data() };
                    tasksData.push(t);
                    
                    const isChecked = t.completado ? 'checked' : '';
                    const textClass = t.completado ? 'line-through text-gray-400' : 'text-gray-800';
                    
                    const disableCheck = currentUserData.rol === 'lector' ? 'disabled' : '';
                    const deleteBtn = (currentUserData.rol === 'admin' || currentUserData.rol === 'editor') 
                        ? `<button onclick="deleteTask('${t.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded transition"><i class="fa-solid fa-trash"></i></button>`
                        : '';

                    taskList.innerHTML += `
                        <li class="flex items-center justify-between p-3 border-b hover:bg-gray-50 transition group">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" ${isChecked} ${disableCheck} onchange="toggleTaskStatus('${t.id}', this.checked)" class="w-5 h-5 text-chinalco rounded focus:ring-chinalco cursor-pointer">
                                <div class="${textClass} font-medium">${t.texto}</div>
                                <span class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600 ml-2">${t.categoria}</span>
                            </div>
                            <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition">
                                <span class="text-xs text-gray-400 italic">Por: ${t.creador}</span>
                                ${deleteBtn}
                            </div>
                        </li>
                    `;
                });
            });
        }

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('new-task-text').value;
            const cat = document.getElementById('new-task-category').value;
            
            await db.collection("tareas").add({
                texto: text,
                categoria: cat,
                completado: false,
                creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
                creador: currentUserData.nombre
            });
            document.getElementById('new-task-text').value = '';
        });

        window.toggleTaskStatus = async (id, status) => {
            await db.collection("tareas").doc(id).update({ completado: status });
        };

        window.deleteTask = async (id) => {
            if(confirm("¿Eliminar esta tarea?")) {
                await db.collection("tareas").doc(id).delete();
            }
        };

        /* =========================================
           6. GESTIÓN DE USUARIOS (ADMIN)
        ========================================= */
        function loadUsers() {
            db.collection("usuarios").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                usersData = [];
                const usersList = document.getElementById('users-list');
                usersList.innerHTML = '';

                snapshot.forEach(doc => {
                    const u = { id: doc.id, ...doc.data() };
                    usersData.push(u);

                    const statusColor = u.estado === 'aprobado' ? 'text-green-600 bg-green-50' : 'text-orange-600 bg-orange-50';
                    
                    usersList.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4">
                                <div class="font-bold text-gray-800">${u.nombre}</div>
                                <div class="text-xs text-gray-500">${u.email}</div>
                            </td>
                            <td class="p-4 text-sm text-gray-600">${u.fechaSolicitud || '-'}</td>
                            <td class="p-4">
                                <div class="flex flex-col gap-1">
                                    <select onchange="updateUser('${u.id}', 'estado', this.value)" class="text-xs p-1 rounded border ${statusColor}">
                                        <option value="pendiente" ${u.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                        <option value="aprobado" ${u.estado === 'aprobado' ? 'selected' : ''}>Aprobado</option>
                                    </select>
                                    <select onchange="updateUser('${u.id}', 'rol', this.value)" class="text-xs p-1 rounded border bg-gray-50">
                                        <option value="lector" ${u.rol === 'lector' ? 'selected' : ''}>Lector</option>
                                        <option value="editor" ${u.rol === 'editor' ? 'selected' : ''}>Editor</option>
                                        <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>Admin</option>
                                    </select>
                                </div>
                            </td>
                            <td class="p-4">
                                <button onclick="deleteUserRecord('${u.id}')" class="text-red-500 hover:text-red-700" title="Eliminar Registro">
                                    <i class="fa-solid fa-user-xmark"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        window.updateUser = async (id, field, value) => {
            const updateObj = {};
            updateObj[field] = value;
            await db.collection("usuarios").doc(id).update(updateObj);
        };

        window.deleteUserRecord = async (id) => {
            if(confirm("Al eliminar este registro el usuario ya no podrá ingresar. ¿Continuar?")) {
                await db.collection("usuarios").doc(id).delete();
            }
        };

        /* =========================================
           7. USUARIOS EN LÍNEA (PRESENCIA)
        ========================================= */
        function startPresenceSystem() {
            const updatePresence = () => {
                if(currentUserData) {
                    db.collection("presencia").doc(currentUserData.id).set({
                        ultimaVez: Date.now()
                    });
                }
            };
            updatePresence();
            heartbeatInterval = setInterval(updatePresence, 60000);

            db.collection("presencia").onSnapshot(snapshot => {
                const now = Date.now();
                let count = 0;
                snapshot.forEach(doc => {
                    if (now - doc.data().ultimaVez < 120000) count++;
                });
                document.getElementById('online-count').innerText = count;
            });
        }

        function stopPresenceSystem() {
            clearInterval(heartbeatInterval);
        }

        /* =========================================
           8. EXPORTAR A EXCEL (SHEETJS)
        ========================================= */
        window.exportToExcel = (type) => {
            let data = [];
            let filename = '';

            if (type === 'tasks') {
                data = tasksData.map(t => ({
                    Tarea: t.texto,
                    Categoría: t.categoria,
                    Estado: t.completado ? 'Completado' : 'Pendiente',
                    Creado_Por: t.creador
                }));
                filename = 'Lista_Pendientes_Emergencias.xlsx';
            } else if (type === 'users') {
                data = usersData.map(u => ({
                    Nombre: u.nombre,
                    Correo: u.email,
                    Rol: u.rol.toUpperCase(),
                    Estado: u.estado.toUpperCase(),
                    Fecha_Solicitud: u.fechaSolicitud
                }));
                filename = 'Registro_Usuarios_Sistema.xlsx';
            }

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Hoja1");
            XLSX.writeFile(workbook, filename);
        };
    </script>
</body>
</html>
